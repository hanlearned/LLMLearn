# Capstone 一键部署
# 用法（在仓库根目录）：
#   1. 确保根目录有 .env（含一个 API Key）
#   2. docker compose -f capstone/docker-compose.yml up --build
#   3. 浏览器打开 http://127.0.0.1:8000/

services:
  customer-service:
    build:
      context: ..                      # 构建上下文是仓库根，才能拷到 common/
      dockerfile: capstone/Dockerfile
    image: yunqi-capstone
    ports:
      - "8000:8000"
    env_file:
      - ../.env                        # 把根目录 .env 里的 API Key 注入容器
    restart: unless-stopped
